<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Join Our Community</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 40px 30px;
            border-radius: 20px;
            text-align: center;
            max-width: 400px;
            width: 100%;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
        }

        h1 {
            color: #ffffff;
            font-size: 26px;
            margin-bottom: 10px;
        }

        p {
            color: #d1d5db;
            font-size: 14px;
            margin-bottom: 30px;
        }

        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
            padding: 15px;
            margin-bottom: 15px;
            border-radius: 12px;
            text-decoration: none;
            font-weight: bold;
            font-size: 16px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }

        .btn-telegram {
            background-color: #0088cc;
            color: white;
        }

        .btn-telegram:hover {
            background-color: #006699;
            transform: translateY(-3px);
        }

        .btn-youtube {
            background-color: #ff0000;
            color: white;
        }

        .btn-youtube:hover {
            background-color: #cc0000;
            transform: translateY(-3px);
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Welcome to Our Hub</h1>
        <p>Latest updates aur exclusive content ke liye humare channels ko join karein!</p>

        <!-- Change Telegram Link Here -->
        <a href="https://t.me/Notyourtypeclose" class="btn btn-telegram" target="_blank">
            Join Telegram Channel
        </a>

        <!-- Change YouTube Link Here -->
        <a href="https://www.youtube.com/@closetorealitytv" class="btn btn-youtube" target="_blank">
            Subscribe YouTube Channel
        </a>
    </div>

</body>
</html>
